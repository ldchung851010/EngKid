name: Deploy EngKid Feature Preview

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/deploy-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MVP feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/space-rescue-mvp

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Prepare static Pages bundle
        shell: bash
        run: |
          cp server/data/scenes-metadata.json dist/scenes-metadata.json

          find dist/assets -type f -name '*.js' -print0 | xargs -0 sed -i \
            -e 's#/api/scenes#./scenes-metadata.json#g' \
            -e 's#/play.html?scene=#./play.html?scene=#g' \
            -e 's#location.href="/"#location.href="./"#g'

          # GitHub Pages cannot provide the cross-origin-isolation headers
          # required by local pthread Whisper. The feature branch uses
          # Safari/Web SpeechRecognition for ASR on github.io instead.
          sed -i 's#<script src="/whisper/whisper.js"></script>##' dist/play.html
          sed -i 's#<script src="\./whisper/whisper.js"></script>##' dist/play.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
