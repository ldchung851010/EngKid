name: Build EngKid MVP

on:
  push:
    branches:
      - master
      - feat/space-rescue-mvp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engkid-mvp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: engkid-mvp-dist
          path: dist
          if-no-files-found: error
