name: Deploy EngKid Preview

on:
  push:
    branches:
      - feat/space-rescue-mvp
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit CJK text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          cjk = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]')
          allowed = {'.ts', '.tsx', '.js', '.mjs', '.cjs', '.md', '.html', '.css', '.json', '.yml', '.yaml', '.txt'}
          skip_parts = {'.git', 'node_modules', 'dist', 'coverage'}
          matches = []

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              if any(part in skip_parts for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  if cjk.search(line):
                      matches.append((str(path), line_no, line.strip()))

          print(f'CJK_MATCH_COUNT={len(matches)}')
          for path, line_no, line in matches:
              print(f'CJK {path}:{line_no}: {line[:240]}')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Prepare static Pages bundle
        shell: bash
        run: |
          # The original HiKid portal expects /api/scenes. GitHub Pages is
          # static, so feed it the same scene metadata as a static JSON file.
          cp server/data/scenes-metadata.json dist/scenes-metadata.json

          # Keep the original UI/navigation while making root-absolute links
          # work from the /EngKid/ project path.
          find dist/assets -type f -name '*.js' -print0 | xargs -0 sed -i \
            -e 's#/api/scenes#./scenes-metadata.json#g' \
            -e 's#/play.html?scene=#./play.html?scene=#g' \
            -e 's#location.href="/"#location.href="./"#g'

          # GitHub Pages cannot set the cross-origin-isolation headers needed
          # by the pthread Whisper build. Pages uses Safari/Web Speech ASR.
          sed -i 's#<script src="/whisper/whisper.js"></script>##' dist/play.html
          sed -i 's#<script src="\./whisper/whisper.js"></script>##' dist/play.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
