name: Build EngKid MVP

on:
  push:
    branches:
      - feat/space-rescue-mvp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engkid-mvp-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit source for CJK text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          cjk = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]')
          allowed = {'.ts', '.tsx', '.js', '.mjs', '.cjs', '.md', '.html', '.css', '.json', '.yml', '.yaml', '.txt'}
          skip_parts = {'.git', 'node_modules', 'dist', 'coverage'}
          matches = []

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              if any(part in skip_parts for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  if cjk.search(line):
                      clean = line.strip().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      matches.append((str(path), line_no, clean))

          print(f'CJK_MATCH_COUNT={len(matches)}')
          for path, line_no, line in matches:
              print(f'::error file={path},line={line_no}::CJK text: {line[:300]}')

          if matches:
              raise SystemExit(f'Found {len(matches)} source lines containing CJK characters')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Prepare static preview bundle
        shell: bash
        run: |
          cp server/data/scenes-metadata.json dist/scenes-metadata.json

          find dist/assets -type f -name '*.js' -print0 | xargs -0 sed -i \
            -e 's#/api/scenes#./scenes-metadata.json#g' \
            -e 's#/play.html?scene=#./play.html?scene=#g' \
            -e 's#location.href="/"#location.href="./"#g'

          sed -i 's#<script src="/whisper/whisper.js"></script>##' dist/play.html
          sed -i 's#<script src="\./whisper/whisper.js"></script>##' dist/play.html

      - name: Audit production bundle for CJK text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('dist')
          cjk = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]')
          allowed = {'.js', '.mjs', '.cjs', '.md', '.html', '.css', '.json', '.yml', '.yaml', '.txt', '.webmanifest', '.svg'}
          matches = []

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  if cjk.search(line):
                      clean = line.strip().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      matches.append((str(path), line_no, clean))

          print(f'DIST_CJK_MATCH_COUNT={len(matches)}')
          for path, line_no, line in matches:
              print(f'::error file={path},line={line_no}::CJK text in production bundle: {line[:300]}')

          if matches:
              raise SystemExit(f'Found {len(matches)} production lines containing CJK characters')
          PY

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: engkid-mvp-dist
          path: dist
          retention-days: 7
